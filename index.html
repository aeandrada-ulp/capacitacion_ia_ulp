*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

input:focus{outline:2px solid var(--ac)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.c h2{font-size:1.05rem;margin:0}
.c .d{color:var(--mut);font-size:.88rem;margin:2px 0 12px;min-height:1.2em}
.b{display:flex;gap:8px}
.b a{flex:1;text-align:center;padding:10px 6px;border-radius:10px;color:#fff;text-decoration:none;font-weight:600;font-size:.92rem}
.m{background:var(--ac)}.w{background:var(--wa)}
.b a:hover{opacity:.88}
.aula{display:block;text-align:center;padding:14px;margin-bottom:18px;background:var(--card);border:2px solid var(--ac);border-radius:12px;color:var(--ac);font-weight:700;text-decoration:none}
.aula:hover{background:var(--ac);color:#fff}
#none{display:none;color:var(--mut)}
</style>
</head>
